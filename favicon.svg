<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#14b8a6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid Lines -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  <line x1="12" y1="34" x2="52" y2="34" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  <line x1="12" y1="48" x2="52" y2="48" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Roadmap Curved Path (Journey from Foundation to Full Stack Goal) -->
  <path d="M 15 48 C 15 34, 31 44, 31 32 C 31 20, 48 26, 48 15" 
        fill="none" 
        stroke="url(#pathGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Stepping / Progress Trail Dots along path -->
  <circle cx="20" cy="40" r="1.5" fill="#5eead4" opacity="0.8"/>
  <circle cx="25" cy="36" r="1.5" fill="#5eead4" opacity="0.8"/>
  <circle cx="37" cy="27" r="1.5" fill="#7dd3fc" opacity="0.8"/>
  <circle cx="42" cy="22" r="1.5" fill="#7dd3fc" opacity="0.8"/>

  <!-- Milestone 1: Foundations (Start) -->
  <circle cx="15" cy="48" r="5" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>

  <!-- Milestone 2: Core Architecture (Midpoint) -->
  <circle cx="31" cy="32" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="31" cy="32" r="2" fill="#ffffff"/>

  <!-- Milestone 3: Job-Ready Full Stack (Goal / Destination) -->
  <!-- Target Beacon Ring -->
  <circle cx="48" cy="15" r="8" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2"/>
  <circle cx="48" cy="15" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Goal Star in Final Node -->
  <polygon points="48,12 49.3,14.5 52,14.8 50,16.7 50.5,19.3 48,18 45.5,19.3 46,16.7 44,14.8 46.7,14.5" fill="#ffffff"/>
</svg>